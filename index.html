<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: #fff;
  display: flex; flex-direction: column; align-items: center;
  padding: 16px 8px 32px; color: #222;
}
header { text-align: center; margin-bottom: 10px; }
header h2 { font-size: 22px; font-weight: 800; letter-spacing: 4px; color: #0052cc; }
header p  { font-size: 12px; color: #999; margin-top: 2px; }

#hint-box {
  display: none; font-size: 12px; color: #555;
  background: #f0f4ff; border: 1px solid #c5d5f5;
  border-radius: 8px; padding: 7px 14px;
  margin-bottom: 10px; text-align: center; max-width: 320px;
}

#toast {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
  background: #1a1a1a; color: #fff; padding: 8px 20px;
  border-radius: 20px; font-size: 13px; font-weight: 700;
  opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 99;
}
#toast.show { opacity: 1; }

#board { display: grid; gap: 5px; margin-bottom: 16px; }

.tile {
  width: 56px; height: 56px;
  border: 2px solid #d3d6da;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; font-weight: 800; text-transform: uppercase;
  border-radius: 4px; background: #fff;
  transition: transform 0.15s ease;
}
.tile.filled  { border-color: #888; animation: pop .1s ease; }
.tile.shake   { animation: shake .4s ease; }

/* Revealed states — only applied after flip completes */
.tile.correct { background: #6aaa64; border-color: #6aaa64; color: #fff; }
.tile.present { background: #c9b458; border-color: #c9b458; color: #fff; }
.tile.absent  { background: #787c7e; border-color: #787c7e; color: #fff; }

@keyframes pop      { 0%{transform:scale(1)} 50%{transform:scale(1.13)} 100%{transform:scale(1)} }
@keyframes shake    { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} }
@keyframes flipDown { 0%{transform:rotateX(0)}   100%{transform:rotateX(-90deg)} }
@keyframes flipUp   { 0%{transform:rotateX(90deg)} 100%{transform:rotateX(0)} }

#keyboard { display:flex; flex-direction:column; gap:6px; align-items:center; margin-bottom:14px; }
.kb-row { display:flex; gap:5px; }
.key {
  height: 54px; min-width: 38px; padding: 0 5px;
  background: #d3d6da; border: none; border-radius: 4px;
  font-size: 13px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: #222; transition: background .15s, color .15s;
  -webkit-user-select: none; user-select: none;
}
.key.wide { min-width: 62px; font-size: 13px; font-weight: 900; }
.key:active { opacity: .75; }
.key.correct { background: #6aaa64; color: #fff; }
.key.present { background: #c9b458; color: #fff; }
.key.absent  { background: #787c7e; color: #fff; }

#hint-btn-wrap { margin-bottom: 12px; min-height: 34px; display: flex; justify-content: center; }
#hint-btn {
  display: none; padding: 7px 20px;
  background: #f0f4ff; color: #0052cc;
  border: 1.5px solid #0052cc; border-radius: 20px;
  font-size: 12px; font-weight: 700; cursor: pointer;
}
#hint-btn:hover { background: #dce8ff; }

#explanation {
  display: none; max-width: 360px; width: 100%;
  border-radius: 12px; overflow: hidden;
  box-shadow: 0 2px 16px rgba(0,0,0,.12); margin-top: 4px;
}
#explanation.show { display: block; }
.exp-header { padding: 14px 18px 10px; background: #0052cc; color: #fff; }
.exp-word    { font-size: 26px; font-weight: 800; letter-spacing: 3px; margin-bottom: 2px; }
.exp-outcome { font-size: 12px; opacity: .85; font-weight: 600; }
.exp-section { padding: 12px 18px; border-bottom: 1px solid #f0f0f0; }
.exp-section:last-of-type { border-bottom: none; }
.exp-tag {
  display: inline-block; font-size: 10px; font-weight: 700;
  letter-spacing: .8px; text-transform: uppercase;
  padding: 2px 8px; border-radius: 10px; margin-bottom: 5px;
}
.tag-general { background: #e8f0fe; color: #0052cc; }
.tag-trading { background: #e6f4ea; color: #1a7a2a; }
.exp-text { font-size: 13px; color: #333; line-height: 1.55; }
.exp-footer { padding: 12px 18px; background: #f8f8f8; display: flex; gap: 8px; }
.exp-footer button {
  flex: 1; padding: 8px; border: none; border-radius: 7px;
  font-size: 12px; font-weight: 700; cursor: pointer;
}
.btn-share  { background: #0052cc; color: #fff; border-radius: 7px; }
.btn-share:hover { background: #0041a8; }
.next-word-plate {
  flex: 1; padding: 8px;
  background: #f0f4ff; color: #0052cc;
  border-radius: 7px; font-size: 12px;
  font-weight: 600; text-align: center;
  display: flex; align-items: center; justify-content: center;
}

async function isValidWord(word) {
  if (GAME_WORDS.has(word)) return true;
  if (word in dictCache) return dictCache[word];

  // 1st try: Datamuse API (CORS-friendly, works in iframes)
  try {
    const res  = await fetch("https://api.datamuse.com/words?sp=" + word.toLowerCase() + "&max=1");
    const data = await res.json();
    // Datamuse returns exact match only if the word exists and spelling matches
    const found = Array.isArray(data) && data.length > 0 &&
                  data[0].word.toUpperCase() === word;
    dictCache[word] = found;
    return found;
  } catch (e) {
    // API blocked — fall back to local list
  }

  // 2nd fallback: local word list
  const inLocal = FALLBACK.has(word);
  dictCache[word] = inLocal;
  return inLocal;
}

let currentRow, currentCol, currentGuess, gameOver, keyStates, tiles, keyEls, guessHistory;
let submitting = false;

function getActiveEntry() {
  const now = new Date();
  let active = null;
  for (const e of SCHEDULE) {
    const parts = e.month.split(" ");
    const mIdx  = MONTHS.indexOf(parts[0]);
    const yr    = parseInt(parts[1]);
    if (now >= new Date(yr, mIdx, 9)) active = e;
  }
  return active || SCHEDULE[0];
}

function init() {
  ENTRY    = getActiveEntry();
  SECRET   = ENTRY.word.toUpperCase();
  WORD_LEN = SECRET.length;
  HINT     = ENTRY.hint;

  currentRow   = 0;
  currentCol   = 0;
  currentGuess = [];
  gameOver     = false;
  submitting   = false;
  keyStates    = {};
  guessHistory = [];

  document.getElementById("hint-box").style.display = "none";
  document.getElementById("hint-box").textContent   = "💡 " + HINT;
  document.getElementById("hint-btn").style.display = "none";
  document.getElementById("explanation").classList.remove("show");

  buildBoard();
  buildKeyboard();
}

function buildBoard() {
  const b = document.getElementById("board");
  b.innerHTML = "";
  b.style.gridTemplateColumns = "repeat(" + WORD_LEN + ", 56px)";
  b.style.gridTemplateRows    = "repeat(" + MAX_GUESSES + ", 56px)";
  tiles = [];
  for (let r = 0; r < MAX_GUESSES; r++) {
    tiles[r] = [];
    for (let c = 0; c < WORD_LEN; c++) {
      const t = document.createElement("div");
      t.className = "tile";
      b.appendChild(t);
      tiles[r][c] = t;
    }
  }
}

function buildKeyboard() {
  const kbd = document.getElementById("keyboard");
  kbd.innerHTML = "";
  keyEls = {};
  KB_ROWS.forEach(function(row) {
    const div = document.createElement("div");
    div.className = "kb-row";
    for (const ch of row) {
      const btn   = document.createElement("button");
      const isWide = (ch === "↵" || ch === "⌫");
      btn.className   = isWide ? "key wide" : "key";
      btn.textContent = ch;
      btn.addEventListener("click", function() { handleKey(ch); });
      div.appendChild(btn);
      keyEls[ch] = btn;
    }
    kbd.appendChild(div);
  });
}

document.addEventListener("keydown", function(e) {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === "Enter")          handleKey("↵");
  else if (e.key === "Backspace") handleKey("⌫");
  else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
});

function handleKey(k) {
  if (gameOver || submitting) return;
  if (k === "⌫") {
    if (currentCol > 0) {
      currentCol--;
      currentGuess.pop();
      tiles[currentRow][currentCol].textContent = "";
      tiles[currentRow][currentCol].classList.remove("filled");
    }
  } else if (k === "↵") {
    submitGuess();
  } else if (currentCol < WORD_LEN && /^[A-Z]$/.test(k)) {
    tiles[currentRow][currentCol].textContent = k;
    tiles[currentRow][currentCol].classList.add("filled");
    currentGuess.push(k);
    currentCol++;
  }
}

async function submitGuess() {
  if (currentCol < WORD_LEN) { shakeCurrent(); toast("Not enough letters"); return; }
  submitting = true;
  const guess = currentGuess.join("");

  toast("Checking…");
  const valid = await isValidWord(guess);
  if (!valid) {
    shakeCurrent();
    toast("Not a valid word");
    submitting = false;
    return;
  }

  const result = scoreGuess(guess, SECRET);
  guessHistory.push({ guess: guess, result: result });

  // Flip each tile: rotate down → apply colour → rotate up
  // Each tile is fully self-contained — colour never bleeds into other rows
  var FLIP_HALF = 180; // ms for each half
  for (var i = 0; i < WORD_LEN; i++) {
    (function(idx, state) {
      var tile = tiles[currentRow][idx];
      var delay = idx * 300; // stagger per letter

      setTimeout(function() {
        // Phase 1: flip down
        tile.style.transition = "transform " + FLIP_HALF + "ms ease-in";
        tile.style.transform  = "rotateX(-90deg)";

        setTimeout(function() {
          // Midpoint: apply colour class while tile is hidden (edge-on)
          tile.classList.remove("filled");
          tile.classList.add(state);

          // Phase 2: flip up — now showing the coloured face
          tile.style.transition = "transform " + FLIP_HALF + "ms ease-out";
          tile.style.transform  = "rotateX(0deg)";
        }, FLIP_HALF);
      }, delay);
    })(i, result[i]);
  }

  var animDone = WORD_LEN * 300 + FLIP_HALF * 2 + 100;
  const won            = (guess === SECRET);
  const rowJustDone    = currentRow;

  currentRow++;
  currentGuess = [];
  currentCol   = 0;
  submitting   = false;

  setTimeout(function() {
    // Update keyboard colours
    for (let i = 0; i < result.length; i++) {
      const ch    = guess[i];
      const state = result[i];
      const prev  = keyStates[ch];
      if (prev === "correct") continue;
      if (prev === "present" && state === "absent") continue;
      keyStates[ch] = state;
      const btn = keyEls[ch];
      if (btn) {
        btn.className = (btn.classList.contains("wide") ? "key wide " : "key ") + state;
      }
    }

    // Show hint button after 3rd failed attempt
    if (!won && currentRow >= 3 && currentRow < MAX_GUESSES) {
      document.getElementById("hint-btn").style.display = "inline-block";
    }

    if (won) {
      gameOver = true;
      document.getElementById("hint-btn").style.display = "none";
      var msgs = ["Genius! 🧠","Magnificent! 🌟","Impressive! 💪","Splendid! 👏","Great! 😊","Phew! 😅"];
      toast(msgs[rowJustDone] || "Nice!");
      setTimeout(function() { showExplanation(true); }, 600);
    } else if (currentRow === MAX_GUESSES) {
      gameOver = true;
      document.getElementById("hint-btn").style.display = "none";
      toast("Better luck next month!");
      setTimeout(function() { showExplanation(false); }, 600);
    }
  }, animDone);
}

function scoreGuess(guess, secret) {
  var res  = [];
  var pool = {};
  for (var i = 0; i < secret.length; i++) { res.push("absent"); }
  for (var i = 0; i < secret.length; i++) {
    if (guess[i] === secret[i]) { res[i] = "correct"; }
    else { pool[secret[i]] = (pool[secret[i]] || 0) + 1; }
  }
  for (var i = 0; i < secret.length; i++) {
    if (res[i] === "correct") continue;
    if (pool[guess[i]]) { res[i] = "present"; pool[guess[i]]--; }
  }
  return res;
}

function shakeCurrent() {
  for (var c = 0; c < Math.max(currentCol, 1); c++) {
    (function(col) {
      tiles[currentRow][col].classList.add("shake");
      setTimeout(function() { tiles[currentRow][col].classList.remove("shake"); }, 400);
    })(c);
  }
}

var toastTimer;
function toast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.classList.remove("show"); }, 2200);
}

function showHint() {
  document.getElementById("hint-box").style.display = "block";
  document.getElementById("hint-btn").style.display = "none";
}

function showExplanation(won) {
  document.getElementById("exp-word").textContent    = SECRET;
  document.getElementById("exp-outcome").textContent = won
    ? "✅ Solved in " + guessHistory.length + (guessHistory.length === 1 ? " try!" : " tries!")
    : "❌ The word was " + SECRET;
  document.getElementById("exp-general").textContent = ENTRY.general;
  document.getElementById("exp-forex").textContent   = ENTRY.forex;
  document.getElementById("explanation").classList.add("show");
}

function shareResult() {
  var E = { correct:"🟩", present:"🟨", absent:"⬛" };
  var lines = guessHistory.map(function(g) {
    return g.result.map(function(s) { return E[s]; }).join("");
  }).join("\n");
  var text = "TFB Wordle · " + ENTRY.month + "\n" + lines + "\n" + guessHistory.length + "/" + MAX_GUESSES;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() { toast("Copied! 📋"); });
  } else {
    prompt("Copy this:", text);
  }
}

function replayGame() { init(); }

init();
</script>
